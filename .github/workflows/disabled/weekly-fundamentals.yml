name: Weekly Fundamentals Update

on:
  schedule:
    - cron: '0 8 * * 0'  # Dimanche 8h UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance pandas psycopg2-binary sqlalchemy==2.0.36

      - name: Run fundamentals update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - << 'PYEOF'
          import os, yfinance as yf, pandas as pd
          from datetime import date
          import sqlalchemy as sa
          from sqlalchemy.orm import Session

          URL = os.environ["DATABASE_URL"].replace("postgres://", "postgresql+psycopg2://").replace("postgresql://", "postgresql+psycopg2://")
          engine = sa.create_engine(URL)

          with Session(engine) as session:
              result = session.execute(sa.text("SELECT DISTINCT ticker FROM ticker_fundamentals"))
              tickers = [r[0] for r in result.all()]

          print(f"Updating {len(tickers)} tickers...")
          import time

          for ticker in tickers:
              try:
                  info = yf.Ticker(ticker).info
                  if not info or not info.get("longName"):
                      continue
                  with Session(engine) as session:
                      session.execute(sa.text("""
                          INSERT INTO ticker_fundamentals (ticker, name, sector, industry, country, currency, exchange, market_cap, beta, dividend_yield, total_debt, total_revenue, updated_at)
                          VALUES (:ticker, :name, :sector, :industry, :country, :currency, :exchange, :market_cap, :beta, :dividend_yield, :total_debt, :total_revenue, :updated_at)
                          ON CONFLICT (ticker) DO UPDATE SET
                              market_cap = EXCLUDED.market_cap,
                              beta = EXCLUDED.beta,
                              dividend_yield = EXCLUDED.dividend_yield,
                              total_debt = EXCLUDED.total_debt,
                              total_revenue = EXCLUDED.total_revenue,
                              updated_at = EXCLUDED.updated_at
                      """), {
                          "ticker": ticker,
                          "name": info.get("longName") or info.get("shortName") or ticker,
                          "sector": info.get("sector", ""),
                          "industry": info.get("industry", ""),
                          "country": info.get("country", ""),
                          "currency": info.get("currency", "USD"),
                          "exchange": info.get("exchange", ""),
                          "market_cap": int(info.get("marketCap") or 0),
                          "beta": float(info.get("beta") or 1.0),
                          "dividend_yield": float(info.get("dividendYield") or 0.0),
                          "total_debt": int(info.get("totalDebt") or 0),
                          "total_revenue": int(info.get("totalRevenue") or 0),
                          "updated_at": str(date.today()),
                      })
                      session.commit()
                  print(f"  Updated {ticker}")
                  time.sleep(0.5)
              except Exception as e:
                  print(f"  Error {ticker}: {e}")

          print("Done")
          PYEOF
