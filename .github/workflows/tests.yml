name: Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sauhabah
          POSTGRES_PASSWORD: sauhabah
          POSTGRES_DB: ethical_finance
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt --quiet
      - run: pip install pytest-cov --quiet
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://sauhabah:sauhabah@localhost:5433/ethical_finance
        run: python -m pytest tests/ -q --tb=short --cov=backend --cov-report=term-missing
