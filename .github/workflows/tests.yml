name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight deps
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn pydantic httpx python-multipart \
            pandas numpy sqlalchemy \
            "python-jose[cryptography]" bcrypt \
            pytest pytest-xdist pytest-asyncio pytest-cov \
            scikit-learn vaderSentiment feedparser \
            reportlab matplotlib

      - name: Run unit tests (no DB, no heavy deps)
        env:
          DATABASE_URL: ""
        run: |
          pytest tests/ -m "unit and not integration" \
            --ignore=tests/test_api_endpoints.py \
            -n auto -q --tb=short \
            --cov=backend --cov-report=xml:coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
