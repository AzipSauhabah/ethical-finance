name: Daily Price Update

on:
  schedule:
    - cron: '0 21 * * 1-5'  # 21h UTC du lundi au vendredi
  workflow_dispatch:  # permet de lancer manuellement

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install yfinance pandas psycopg2-binary sqlalchemy==2.0.36

      - name: Run daily update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - << 'PYEOF'
          import os
          import yfinance as yf
          import pandas as pd
          from datetime import date, timedelta
          import sqlalchemy as sa
          from sqlalchemy.orm import Session

          DATABASE_URL = os.environ["DATABASE_URL"]
          SYNC_URL = DATABASE_URL.replace("postgres://", "postgresql+psycopg2://").replace("postgresql://", "postgresql+psycopg2://")
          engine = sa.create_engine(SYNC_URL)

          # Récupère les tickers en DB
          with Session(engine) as session:
              result = session.execute(sa.text("SELECT DISTINCT ticker FROM ohlcv"))
              tickers = [r[0] for r in result.all()]

          print(f"Updating {len(tickers)} tickers...")
          start = (date.today() - timedelta(days=5)).isoformat()
          end = date.today().isoformat()

          rows = []
          for ticker in tickers:
              try:
                  df = yf.download(ticker, start=start, end=end, auto_adjust=False, progress=False)
                  if df.empty:
                      continue
                  if isinstance(df.columns, pd.MultiIndex):
                      df.columns = [col[0] for col in df.columns]
                  for idx, row in df.iterrows():
                      rows.append({
                          "ticker": ticker,
                          "date": idx.date().isoformat(),
                          "open": float(row.get("Open", 0) or 0),
                          "high": float(row.get("High", 0) or 0),
                          "low": float(row.get("Low", 0) or 0),
                          "close": float(row.get("Close", 0) or 0),
                          "adj_close": float(row.get("Adj Close", row.get("Close", 0)) or 0),
                          "volume": int(row.get("Volume", 0) or 0),
                      })
              except Exception as e:
                  print(f"Error {ticker}: {e}")

          if rows:
              df_out = pd.DataFrame(rows)
              with engine.connect() as conn:
                  for _, row in df_out.iterrows():
                      conn.execute(sa.text("""
                          INSERT INTO ohlcv (ticker, date, open, high, low, close, adj_close, volume)
                          VALUES (:ticker, :date, :open, :high, :low, :close, :adj_close, :volume)
                          ON CONFLICT (ticker, date) DO UPDATE SET
                              close = EXCLUDED.close,
                              adj_close = EXCLUDED.adj_close,
                              volume = EXCLUDED.volume
                      """), row.to_dict())
                  conn.commit()
              print(f"Updated {len(rows)} rows")
          PYEOF
