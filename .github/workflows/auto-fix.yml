name: Auto Fix Python

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install ruff black

      - name: Ruff auto-fix (max fixes)
        run: |
          ruff check . --fix --unsafe-fixes || true

      - name: Black format
        run: |
          black .

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: auto-fix ruff + black"
