version: "3.9"

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ethical-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ethical_finance
      POSTGRES_USER: sauhabah
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - /volume1/docker/ethical-finance/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sauhabah -d ethical_finance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend FastAPI ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: ethical-finance-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sauhabah:${DB_PASSWORD}@db:5432/ethical_finance
      APP_ENV: production
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
    volumes:
      - /volume1/docker/ethical-finance/data:/app/data
      - /volume1/docker/ethical-finance/backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── pgAdmin ──────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: ethical-finance-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sauhabah.eu
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: ethical-finance-network
