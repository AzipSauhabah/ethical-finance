name: SonarQube Analysis

on:
  push:
    branches:
      - main

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: SonarQube Scan
        run: |
          /volume1/docker/sonar-scanner/bin/sonar-scanner \
            -Dsonar.projectKey=ethical-finance \
            -Dsonar.sources=/volume1/docker/ethical-finance/backend \
            -Dsonar.host.url=http://192.168.1.47:9000 \
            -Dsonar.token=sqp_5547ed4f4f69d360cd207304ab3f241086282fec
