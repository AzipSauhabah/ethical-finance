name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests in API container
        run: |
          docker exec ethical-finance-api python3 -m pytest tests/ -v -m "not integration" --tb=short || true
