name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements-dev.txt --break-system-packages

      - name: Run tests
        run: python3 -m pytest tests/ -v -m "not integration" --tb=short

      - name: Run coverage
        run: |
          python3 -m pytest tests/ -m "not integration" \
            --cov=backend \
            --cov-report=term-missing
        continue-on-error: true
