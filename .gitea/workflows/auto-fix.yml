name: Auto Fix Python

on:
  push:
    branches: [main]

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: pip3 install ruff black --break-system-packages

      - name: Ruff auto-fix
        run: python3 -m ruff check . --fix --unsafe-fixes || true

      - name: Black format
        run: python3 -m black .

      - name: Commit fixes
        run: |
          git config user.email "bot@sauhabah.eu"
          git config user.name "Gitea Bot"
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-fix ruff + black"
          git push || true
