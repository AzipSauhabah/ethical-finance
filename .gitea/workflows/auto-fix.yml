name: Auto Fix Python

on:
  push:
    branches: [main]

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Ruff auto-fix in API container
        run: |
          docker exec ethical-finance-api python3 -m ruff check /app --fix --unsafe-fixes || true
          docker exec ethical-finance-api python3 -m black /app || true

      - name: Commit fixes
        run: |
          export PATH="/volume1/docker/bin:$PATH"
          cd /volume1/docker/ethical-finance
          git config user.email "bot@sauhabah.eu"
          git config user.name "Gitea Bot"
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-fix ruff + black"
          git push || true
